name: Layer By Layer
description: 'Layer By Layer was a San Francisco 3D-printing software startup founded
  in 2012 and part of Y Combinator''s Summer 2013 batch. It operated a marketplace
  for buying, selling, and sharing printable 3D designs, and built streaming and digital
  rights management technology that let licensed content partners distribute 3D-printable
  intellectual property without handing over raw model files. MakerBot (Stratasys)
  announced its acquisition of the company in November 2014 and folded the streaming
  and DRM technology into the MakerBot Digital Store. The company no longer operates
  independently: layerbylayer.com is a parked domain, and there is no developer portal,
  documentation, public API, or GitHub organization to enrich.'
